[build]
  publish = "."
  # lp/ 配下に変更がない push（X/Threads/IG/Note の投稿ログ更新など）ではデプロイをスキップする。
  # 2026-07: ログコミット毎の無駄デプロイで無料枠300クレジット/月を使い切ったための対策。
  # ⚠️ $CACHED_COMMIT_REF が空 or 取得不能だと素の `git diff --quiet $COMMIT_REF -- .` に
  # 退化し「作業ツリー vs HEAD＝差分なし」で常に exit 0 ＝ 永久にスキップし続ける。
  # 実際に 2026-08-24〜09-11 のビルド40件が全部この理由でキャンセルされていた。
  # そのため ref が使えないときは必ずビルドする（非0で終わる）ようガードを付ける。
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && git cat-file -e "$CACHED_COMMIT_REF^{commit}" 2>/dev/null && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[[redirects]]
  from = "/"
  to = "/beginner/index.html"
  status = 200

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# beginner LP は shared/ ではなく自前のCSS/JSを持つ。
# HTML側で ?v=YYYYMMDD のクエリを付けてキャッシュバストしているので長めのmax-ageで安全。
[[headers]]
  for = "/beginner/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/beginner/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
