[build]
  publish = "."
  # lp/ 配下に変更がない push（X/Threads/IG/Note の投稿ログ更新など）ではデプロイをスキップする。
  # 2026-07: ログコミット毎の無駄デプロイで無料枠300クレジット/月を使い切ったための対策。
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[redirects]]
  from = "/"
  to = "/beginner/index.html"
  status = 200

[[headers]]
  for = "/shared/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# beginner LP は shared/ ではなく自前のCSS/JSを持つ。
# HTML側で ?v=YYYYMMDD のクエリを付けてキャッシュバストしているので長めのmax-ageで安全。
[[headers]]
  for = "/beginner/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/beginner/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
