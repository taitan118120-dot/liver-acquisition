<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7a6b0">
  <title>ネイル自動投稿 ログイン</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <style>
    body{ margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif;
      background:#fdf6f4; color:#4a3b3e; display:flex; min-height:100vh;
      align-items:center; justify-content:center; }
    .box{ background:#fff; border-radius:22px; padding:36px 28px; width:88%; max-width:340px;
      text-align:center; box-shadow:0 8px 28px rgba(200,140,150,.14); }
    h1{ font-size:22px; margin:0 0 4px; }
    p{ color:#9a8a8d; font-size:13px; margin:0 0 22px; }
    input{ width:100%; padding:16px; font-size:17px; border:2px solid #f0d8d8; border-radius:14px;
      text-align:center; margin-bottom:14px; }
    button{ width:100%; padding:16px; font-size:18px; font-weight:700; color:#fff; border:none;
      border-radius:14px; background:linear-gradient(135deg,#e7a6b0,#d67f8d); }
    .err{ color:#c05656; font-size:13px; margin-bottom:12px; }
  </style>
</head>
<body>
  <form class="box" method="post">
    <h1>💅</h1>
    <p>あいことばを入れてください</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="あいことば" autofocus inputmode="text">
    <button type="submit">はじめる</button>
  </form>
</body>
</html>
