<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7a6b0">
  <title>これまでの投稿</title>
  <style>
    body{ margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; background:#fdf6f4; color:#4a3b3e; }
    header{ text-align:center; padding:20px 16px 10px; }
    header h1{ font-size:18px; margin:0; }
    .wrap{ max-width:480px; margin:0 auto; padding:8px 16px 60px; }
    .item{ background:#fff; border-radius:16px; padding:14px; margin-bottom:12px; display:flex; gap:12px;
      box-shadow:0 4px 16px rgba(200,140,150,.10); }
    .item img{ width:74px; height:74px; object-fit:cover; border-radius:12px; flex:0 0 auto; background:#f3e7e7; }
    .meta{ font-size:12px; min-width:0; }
    .time{ color:#9a8a8d; }
    .cap{ margin-top:4px; color:#6b585b; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical;
      overflow:hidden; white-space:pre-wrap; }
    .badge{ display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px; margin-top:6px; }
    .b-posted{ background:#eef8ef; color:#3f8a4f; }
    .b-draft{ background:#fff4ef; color:#b57a53; }
    .b-failed,.b-token_expired{ background:#fdeeee; color:#c05656; }
    .back{ display:block; text-align:center; margin-top:10px; color:#9a8a8d; text-decoration:none; }
    .empty{ text-align:center; color:#9a8a8d; margin-top:40px; }
  </style>
</head>
<body>
  <header><h1>📋 これまでの投稿</h1></header>
  <div class="wrap">
    {% if not posts %}
      <div class="empty">まだ投稿はありません</div>
    {% endif %}
    {% for p in posts %}
    <div class="item">
      <img src="/uploads/{{ p.photo }}" alt="" loading="lazy">
      <div class="meta">
        <div class="time">{{ p.time|replace('T',' ') }}</div>
        {% set s = p.status %}
        <span class="badge b-{{ s }}">
          {% if s=='posted' %}投稿済み{% elif s=='draft' %}下書き{% elif s=='token_expired' %}要トークン更新{% else %}失敗{% endif %}
        </span>
        <div class="cap">{{ p.caption }}</div>
      </div>
    </div>
    {% endfor %}
    <a class="back" href="/">← もどる</a>
  </div>
</body>
</html>
