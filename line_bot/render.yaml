services:
  - type: web
    name: taitan-pro-line-bot
    runtime: python
    buildCommand: ""
    startCommand: python3 app.py
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: GITHUB_STATE_TOKEN
        sync: false
      # 代理店パートナー向けリッチメニューのID（rich_menu.py の出力を貼る）
      - key: RICH_MENU_ID_AGENCY
        sync: false
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Tokyo
