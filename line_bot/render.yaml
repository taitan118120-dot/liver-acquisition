services:
  - type: web
    name: taitan-pro-line-bot
    runtime: python
    buildCommand: ""
    startCommand: python3 app.py
    envVars:
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_ADMIN_USER_ID
        sync: false
      - key: GITHUB_STATE_TOKEN
        sync: false
      # 代理店パートナー向けリッチメニューのID。
      # 未設定でよい（app.pyがLINEのメニュー一覧から名前で自動解決する）。
      # 特定のIDに固定したいときだけRenderの環境変数に入れる。
      - key: RICH_MENU_ID_AGENCY
        sync: false
      - key: PORT
        value: 10000
      - key: TZ
        value: Asia/Tokyo
