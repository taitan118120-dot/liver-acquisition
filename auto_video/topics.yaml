# ライバー獲得用 バズりトピック集 (auto_video/make.py --yaml から読み込み)
# 各項目: topic (必須), angle (切り口ヒント), audience, sec
topics:
  - topic: "ライバー月収のリアル格差"
    angle: "下位50%と上位トップの月収の落差を数字階段で見せる"
    audience: "スマホ副業探す20代〜30代女性"
    sec: 26

  - topic: "事務所所属 vs フリーライバー"
    angle: "事務所の方が稼げる理由と、所属を選ぶ人が知らない盲点"
    audience: "ライバー興味あるが一人でやるか事務所かで迷ってる層"
    sec: 28

  - topic: "顔出しなしライバーの現実"
    angle: "顔出しなしでも稼げるが、代わりに必要な3つのスキル"
    audience: "顔出しに抵抗ある20代〜40代"
    sec: 26

  - topic: "ライバー始めて1ヶ月で辞める人の共通点"
    angle: "続かない人の3つの勘違い、続く人の思考"
    audience: "ライバー始めたばかり / 始めようか迷ってる層"
    sec: 28

  - topic: "副業ライバーで会社バレしない方法"
    angle: "住民税・確定申告・顔出しの3ステップ"
    audience: "会社員の副業希望者"
    sec: 28

  - topic: "ライバーの1日スケジュール"
    angle: "トップライバーの配信前ルーティンと時間配分"
    audience: "これから始める層・続け方に悩む層"
    sec: 26

  - topic: "怪しいライバー事務所の見分け方"
    angle: "契約書で絶対チェックする3点と危険ワード"
    audience: "事務所選びで失敗したくない全員"
    sec: 28

  - topic: "スマホ1台でライバー始める最短ステップ"
    angle: "登録から初配信までの最短24時間ロードマップ"
    audience: "完全未経験・機材ゼロの人"
    sec: 24

  - topic: "40代50代ライバーは稼げないという嘘"
    angle: "年代別のファン層・収入レンジ、年齢が武器になる理由"
    audience: "40代〜50代で副業探してる層"
    sec: 28

  - topic: "ライバー代理店 副業で月5万の現実"
    angle: "所属ライバー紹介で得られる報酬の内訳と到達日数"
    audience: "副業で代理店業やってみたい層"
    sec: 28
