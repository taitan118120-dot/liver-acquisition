name: Instagram API 診断

# subcode 33（Object with ID ... does not exist）は原因が5通りあって
# エラー文からは区別できない。Secretsはローカルに無いので、切り分けは
# ここ（Actions上）でやる。手動実行専用・書き込みなし・読み取りだけ。
#
# 出力にアクセストークンは出さない。INSTAGRAM_BUSINESS_ID も指紋だけ出す。
# 詳細は instagram/ig_diagnose.py の docstring を参照。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 診断実行
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
        run: |
          python instagram/ig_diagnose.py | tee "$RUNNER_TEMP/diag.txt"
          {
            echo '## Instagram API 診断結果'
            echo '```'
            cat "$RUNNER_TEMP/diag.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
