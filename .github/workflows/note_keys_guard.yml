name: 公開キー台帳 番犬

# 公開キー台帳 data/published_note_keys.json と note の実状態のズレを週1で検知する番犬。
#
# 背景: 2026-08-05、台帳98件の古いブランチ claude/adoring-greider-7df689 を
# そのままマージすると main の108件が巻き戻る状態だった
# （data/branch_close_adoring-greider-7df689_2026-08-05.md）。
# 並行 worktree が10本以上あるので、台帳の巻き戻し・取りこぼしは再発しうる。
# ズレたままだと note_leadmagnet_publish.py --all などの一括処理が
# 死にキーを踏んで無駄な失敗を出し続ける。
#
# 動作: 週1回 note_keys_registry.py --check --json を実行し、
#   - 台帳にあるが note で404（非公開/削除済み） → dead
#   - note_key_map.json にあり公開中だが台帳に無い → missing
#   のどちらかがあればランを赤にし、Issueを作成/更新して通知する。
#
# ズレが直って緑に戻ったら、そのIssueを自動クローズする。
#
# 【2026-08-07 追加】自動クローズがなかったため、link_guard の Issue #5 は
# 直後に修正済みだったのに18日間オープンのまま放置され、通知が形骸化していた。
# 番犬は「鳴く」だけでなく「鳴きやむ」ところまでが仕組み。
#
# 台帳の正本は note_keys_registry.py。このワークフローは検知だけで、
# --fix による自動書き換えはしない（人が中身を見て反映する）。
# 全件を1.2秒間隔で叩くので108件で3分弱。API負荷を考えて毎日は回さない。

on:
  schedule:
    - cron: '50 0 * * 1'   # 毎週月曜 JST 9:50
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  keys-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 台帳と note の実状態を突合
        id: guard
        run: python3 note_keys_registry.py --check --json

      - name: ズレ検知 → Issue通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '公開キー台帳のズレ検知（台帳番犬）';
            let report = {total: 0, dead: [], missing: [], errors: []};
            try {
              report = JSON.parse(fs.readFileSync('data/note_keys_guard_report.json', 'utf8'));
            } catch (e) {}
            const dead = (report.dead || []).map(d =>
              `- \`${d.key}\` (http=${d.status}) ← 台帳にあるが公開されていない`
            ).join('\n');
            const missing = (report.missing || []).map(k =>
              `- \`${k}\` ← 公開中だが台帳に無い`
            ).join('\n');
            const errors = (report.errors || []).map(e =>
              `- \`${e.key}\` ${e.status}`
            ).join('\n');
            const lines = [dead, missing].filter(Boolean).join('\n')
              || '(ズレ無し。照会失敗のみ)';
            const body = [
              '## 公開キー台帳 番犬 検知',
              '',
              `台帳 \`data/published_note_keys.json\`（${report.total}件）と note の実状態がズレています。`,
              '**放置すると `note_leadmagnet_publish.py --all` などの一括処理が死にキーを踏み続けます。**',
              '',
              '## ズレ',
              lines,
              '',
              errors ? ['## 照会できなかったキー（判定不能・触っていない）', errors, ''].join('\n') : '',
              '## 対処',
              '1. まず巻き戻しでないか疑う（古いブランチのマージで台帳だけ戻っていないか）',
              '2. 内容を確認したうえで `python3 note_keys_registry.py --fix` で台帳に反映',
              '3. `python3 note_keys_registry.py --check` が緑になることを確認してコミット',
              '',
              '直すと次回のランがこのIssueを自動クローズします。',
              '',
              '---',
              '_このIssueは `.github/workflows/note_keys_guard.yml` により自動生成されました。_',
            ].join('\n');
            // 同じズレが直るまでは毎ラン赤になる。そのたびに同内容のコメントを積むと
            // メール通知だけが毎日増えるので、内容が変わったときだけ鳴く（赤は維持）。
            const guard = require('./.github/scripts/guard_comment.js');
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()}\n\n${lines}`,
            });

      - name: ズレ解消 → Issueを自動クローズ
        # --check は台帳と note を全件突合する「現在の全状態」の検査なので、
        # 緑＝ズレゼロが確定する。失敗時は success() が false になるので
        # 上の通知ステップとは排他になる。
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '公開キー台帳のズレ検知（台帳番犬）';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) return;
            // 突合件数はレポートから拾う。読めなくてもクローズ判断は
            // ステップの成否だけで決まるので、文面から件数を落とすだけにする。
            let total = null;
            try {
              total = JSON.parse(
                fs.readFileSync('data/note_keys_guard_report.json', 'utf8')
              ).total;
            } catch (e) {}
            const scope = total === null ? '台帳と note の全件突合' : `台帳${total}件と note の突合`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `復旧を確認: ${new Date().toISOString()} のランで ${scope} が一致しました（dead=0 / missing=0）。自動クローズします。`,
                '',
                `- ラン: ${runUrl}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
