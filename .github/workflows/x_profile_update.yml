name: Xプロフィール更新

# bio更新は OAuth1.0a ユーザーコンテキストが必要で、トークンはSecretsにしか無い。
# 自動実行はしない（プロフィールは頻繁に変えるものではない）。手動dispatch専用。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '送信せず内容と文字数だけ確認する'
        type: boolean
        default: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install tweepy

      - name: プロフィール更新
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          python x_profile_update.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: 反映を検証
        if: ${{ !inputs.dry_run }}
        run: |
          sleep 5
          curl -s -H 'Cache-Control: no-cache' https://api.fxtwitter.com/taitan_LIVER \
            | python3 -c "import json,sys; u=json.load(sys.stdin)['user']; print('name:',u['name']); print('desc:',u['description']); print('url:',u.get('website'))"
