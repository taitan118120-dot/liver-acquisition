name: 投稿自動進化

on:
  schedule:
    # 週2回（月曜・木曜 JST 10:00）コンテンツ鮮度を上げる
    - cron: '0 1 * * 1'
    - cron: '0 1 * * 4'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  evolve:
    # ubuntu-latest はランナー移行のタイミングで割り当て失敗を起こすことがあるため固定
    runs-on: ubuntu-24.04
    # スクリプトがハングしても長時間ランナーを占有しないよう上限を設定
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 依存インストール（一時障害に備えリトライ）
        run: |
          for i in 1 2 3; do
            pip install tweepy google-genai && break
            echo "pip install 失敗（$i 回目）。10秒後に再試行..." && sleep 10
          done
      - name: 分析＆新投稿生成
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python cloud_evolve.py
      - name: 新投稿を保存
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add posts/ data/ || true
          git diff --staged --quiet || git commit -m "投稿進化: 新コンテンツ追加"
          git push || true
