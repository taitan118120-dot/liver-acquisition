name: Note記事 自動投稿

on:
  schedule:
    # 1日1回投稿（JST 8:03）。2026-07-29にユーザー指示で日3回→日1回へ変更。
    # 記事の書き溜めペースに投稿ペースを合わせ、在庫切れによる停止を起きにくくする。
    - cron: '3 23 * * *'     # JST 08:03（UTC 23:03 前日）
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run（投稿せず確認のみ）'
        required: false
        default: 'false'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post-article:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Playwrightブラウザをキャッシュ
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: 依存パッケージインストール
        run: |
          pip install requests playwright
          playwright install --with-deps chromium

      - name: "Note.comに投稿"
        if: github.event.inputs.dry_run != 'true'
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
          NOTE_COOKIES_JSON: ${{ secrets.NOTE_COOKIES_JSON }}
        run: python note_auto_poster.py --post-latest

      - name: ログイン失敗時の診断情報をアップロード
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: login-diagnostics-${{ github.run_id }}
          path: data/login_diag/
          if-no-files-found: ignore
          retention-days: 7

      - name: ログを保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 診断ファイル(data/login_diag/)は.gitignoreで除外済み。Artifactで回収する。
          # 先にcommitしてからpullする。ポスターが書き換えたdata/*が未commitのまま
          # pull --rebaseすると "cannot pull with rebase: You have unstaged changes" で
          # 必ず失敗し、古いbase上でcommit→push rejected という詰み方をする（2026-08-05）
          git add data/note_auto_post_log.csv data/note_keyword_tracker.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Note自動投稿ログ $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          # pushの失敗を握り潰すと「投稿済み」記録が消えて次回の重複投稿要因になるためリトライする
          # （それでも失敗した場合はposter側のタイトル重複ガードが最後の砦）
          PUSHED=0
          for i in 1 2 3; do
            if git push; then PUSHED=1; break; fi
            echo "push失敗 (試行$i) → rebaseして再試行"
            sleep 5
            # ログCSVの末尾衝突は .gitattributes の merge=union が自動解決する。
            # それでも解決できない衝突が残ったら rebase を必ず畳む。放置すると
            # detached HEAD になり、以降のpull/pushが全部死んでcommitごと消える
            git pull --rebase || { git rebase --abort || true; git checkout main || true; }
          done
          if [ "$PUSHED" != "1" ] && ! git diff --quiet HEAD origin/main -- data/note_auto_post_log.csv; then
            echo "::error::投稿ログをpushできませんでした。note.com上は投稿済みでもログ未記録の可能性があります"
            echo "## ❌ 投稿ログのpush失敗（note側は投稿済みの可能性あり）" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
