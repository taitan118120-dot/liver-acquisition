name: Threadsトークン更新

on:
  schedule:
    # 月2回（1日・15日 JST 9:00 = UTC 0:00）。60日期限の長期トークンを早めに延長
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存
        run: pip install requests

      - name: トークン更新（Secret書き換え）
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        shell: bash
        run: |
          # ここは握り潰さない。更新に失敗したまま緑になると、60日で
          # THREADS_ACCESS_TOKEN が失効して Threads 投稿が全停止する。
          # 実行は月2回だけなので、赤くなる = 手動再認証が必要というシグナル。
          set +e
          python threads/threads_token.py --refresh
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::error::Threadsトークンの更新に失敗 exit=$EXIT"
            {
              echo "## ❌ Threadsトークン更新失敗 (exit=$EXIT)"
              echo "放置すると60日以内に THREADS_ACCESS_TOKEN が失効し、Threads自動投稿が全停止します。"
              echo "手動で長期トークンを取り直して Secret THREADS_ACCESS_TOKEN を更新してください。"
            } >> $GITHUB_STEP_SUMMARY
          fi
          exit $EXIT

      - name: token_info保存
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add threads/threads_token_info.json
          if ! git diff --staged --quiet; then
            git commit -m "Threadsトークン情報更新"
            # threads_token_info.json は残り日数の記録用（--check で表示するだけ）で、
            # トークン本体は既にSecretへ書き込み済み。push失敗は赤にせず警告に留める。
            git push origin main || echo "::warning::token_info のpushに失敗（記録のみ・トークン自体は更新済み）"
          fi
          exit 0
