name: LINE Bot auto deploy

# RenderのAuto-Deploy(On Commit)はGitHub連携のwebhookが機能しておらず、
# 全デプロイが手動になっていた（Events履歴で確認済み）。
# このワークフローが line_bot/ 配下の変更push時にDeploy Hookを叩いて自動化する。
# 事前条件: リポジトリsecretに RENDER_DEPLOY_HOOK（Render Settings > Deploy Hook のURL）

on:
  push:
    branches: [main]
    paths:
      - 'line_bot/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secretが未設定です（Render Settings > Deploy HookのURLを登録してください）"
            exit 1
          fi
          curl -fsS -o /dev/null -w "deploy trigger: HTTP %{http_code}\n" "$HOOK"

      - name: Wait until service responds
        run: |
          sleep 60
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 70 https://liver-acquisition.onrender.com/ || true)
            echo "check #$i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 30
          done
          echo "::warning::デプロイ後にHTTP 200が確認できなかった（Renderダッシュボードを確認）"
