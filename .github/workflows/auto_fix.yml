name: エラー自動通知

# NOTE: 以前は anthropics/claude-code-action@v1 による自動修復を行っていたが、
# Claude Code GitHub App (https://github.com/apps/claude) が未インストールのため
# 401 Unauthorized で毎回失敗していた。
# 依存ゼロで確実に動く Issue 通知に差し替え済み。
# 自動修復を復活させたい場合は上記 GitHub App をインストールした上で
# git history から旧設定を復元すること。

on:
  workflow_run:
    workflows:
      - 週次分析
      - リード検索
      - 投稿自動進化
      - 自動フォロー
      - リスト自動追加
      - 自動投稿
      - X投稿ウォッチドッグ
      - Instagram自動投稿
      - Instagramトークン自動更新
      - Note記事 自動投稿
      - Note記事 一括更新
      - 誤フォロー除去(ワンショット)
    types: [completed]

jobs:
  notify-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read   # guard_comment.js を取るチェックアウトに必要
    steps:
      # guard_comment.js を使うためだけの最小チェックアウト（workflow_run は既定でコードを持たない）
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts

      - name: Create or update issue on workflow failure
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const workflowName = run.name;
            const runId = run.id;
            const branch = run.head_branch || 'main';
            const url = run.html_url;
            const title = `ワークフロー失敗: ${workflowName}`;

            const body = [
              '## ワークフロー失敗通知',
              '',
              `- **ワークフロー**: \`${workflowName}\``,
              `- **ブランチ**: \`${branch}\``,
              `- **Run ID**: \`${runId}\``,
              `- **URL**: ${url}`,
              '',
              '## 原因確認コマンド',
              '```bash',
              `gh run view ${runId} --log-failed`,
              '```',
              '',
              '---',
              '_このIssueは `.github/workflows/auto_fix.yml` により自動生成されました。_',
            ].join('\n');

            // 旧実装は失敗のたびに「再発: Run #… が失敗しました」を無条件で積んでいた。
            // Issueを1本にまとめてもコメント1件ごとにメールが飛ぶので、
            // 「同じワークフローがまだ直っていない」という1つの事実で通知だけが増え続け、
            // 2026-08-23〜09-06 の自動投稿では Issue #45 がコメント81件になった（2026-09-06修正）。
            // 番犬側で先に解決していた guard_comment.js に寄せ、内容が変わったときだけ鳴かせる。
            //
            // recomment に Run ID や時刻を混ぜないこと。混ぜると同一判定が毎回外れて
            // 元の毎ラン投稿に逆戻りする（先頭の「再検知:」行だけは比較から除かれる）。
            // 最新の失敗ランはIssue本文のURLではなくActionsタブで追う運用に倒した。
            const guard = require('./.github/scripts/guard_comment.js');
            const result = await guard.notify({
              github, context, title, body,
              recomment: [
                `再検知: ${new Date().toISOString()}`,
                '',
                `\`${workflowName}\` はまだ失敗し続けています。`,
                '最新の失敗ランは Actions タブで確認してください。',
                '内容が変わらないかぎり、このコメントは増えません。',
              ].join('\n'),
            });
            core.info(`[auto_fix] guard_comment: ${result}`);

  # 自動リトライ等で復旧したら、対応する失敗Issueを自動クローズする
  # （開きっぱなしのIssueが溜まると本物の障害が埋もれるため）
  close-on-recovery:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Close matching failure issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const title = `ワークフロー失敗: ${run.name}`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) {
              core.info('該当する失敗Issueなし');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: `復旧: [Run #${run.id}](${run.html_url}) が成功しました。自動クローズします。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
            core.info(`Closed issue #${match.number}`);
