name: Threads自動投稿

on:
  schedule:
    # 30分おきに終日起動して、実際に投稿するかは threads/threads_slot.py が
    # JSTの実時刻で決める（投稿は従来どおり1日2本まで）。
    #
    # 以前は JST 9:00/22:00 を狙って UTC 0:00/13:00 に置いていたが、
    # Actions の schedule 遅延が 8/27 以降に 2〜4時間へ悪化し、実際の着弾が
    # JST 11時台と深夜1〜2時台に固定されていた。時刻別の実測(中央値)は
    #   9時44 / 10時24 / 22時64 / 23時56  ←狙っていた帯
    #   8時16.5 / 11時22.5 / 深夜1〜2時33.5 ←実際に落ちていた帯
    # で、9月のリーチ低下(中央値50.5→24)はこの時刻崩れと同期している。
    # cron を前倒ししても遅延幅が日によって変わるので制御できない。
    # 「終日起動＋着弾時刻で判定」にすれば遅延が何時間でも枠内の回が必ず出る。
    # ウィンドウ外の回はゲート判定だけで数秒で終わる（PUBLICリポなので無料）。
    # 分は毎時0/15/30/45を避ける（その時刻ほど混雑して遅延が伸びるため）。
    - cron: '18,48 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行（投稿しない）'
        type: boolean
        default: false
      require_reply_link:
        description: 'reply_link付きの投稿だけを対象にする（CTA返信の動作確認用）'
        type: boolean
        default: false
      ignore_window:
        description: '投稿ウィンドウ(JST)を無視して即実行する'
        type: boolean
        default: false

# 重複投稿・git競合を防ぐ
concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  threads-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # ゲート判定までは履歴を引かない。30分おきに起動するので、150MB超の
      # パックを毎回フルcloneすると無駄が大きい。通過した回だけ unshallow する。
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 投稿ウィンドウ判定（JST）
        id: gate
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.ignore_window }}" = "true" ]; then
            echo "[GATE] ignore_window=true → ウィンドウ判定をスキップ"
            echo "should_post=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 標準ライブラリだけで動くので setup-python / pip install より前に置ける
          python3 threads/threads_slot.py --check
          exit 0

      - name: 判定結果
        if: steps.gate.outputs.should_post != 'true'
        shell: bash
        run: echo "${{ steps.gate.outputs.reason }} → 今回は投稿しません"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.should_post == 'true'
        with:
          python-version: '3.11'

      - name: 依存パッケージ
        if: steps.gate.outputs.should_post == 'true'
        shell: bash
        run: |
          set +e
          pip install requests google-genai
          exit 0

      - name: 最新データ取得
        if: steps.gate.outputs.should_post == 'true'
        shell: bash
        run: |
          set +e
          # ログ保存の rebase / push に履歴が要るので、ここで全体を引き直す
          git fetch --unshallow --no-tags origin main || git fetch --no-tags origin main
          git pull --rebase origin main
          exit 0

      - name: キューを補充（残り少なければGeminiで生成）
        if: steps.gate.outputs.should_post == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +e
          UNPOSTED=$(python -c "import json;d=json.load(open('threads/threads_posts.json'));print(sum(1 for p in d if not p.get('posted')))" 2>/dev/null || echo 0)
          echo "未投稿キュー: $UNPOSTED"
          if [ "$UNPOSTED" -lt 4 ]; then
            # 生成後に機械検品で落とす分があるので、必要数より多めに要求する
            echo "キュー残りわずか → 生成"
            python threads/threads_content.py --gen 14
          fi
          echo "--- キュー検品 ---"
          # 検品の結果でジョブを落とさない。落とすと1日2回の配信が丸ごと欠けるうえ、
          # 違反1本と配信停止では後者のほうが損が大きい。実際のブロックは
          # threads_poster 側（投稿直前に同じ _violations を掛けて該当分だけ除外）が担う。
          # ここは「気づける」ことに徹して警告とサマリを出す。
          # ※ `--audit | tail -1` はパイプ後段の終了コードを見てしまうので変数に受ける。
          AUDIT_OUT=$(python threads/threads_content.py --audit 2>&1)
          AUDIT_RC=$?
          echo "$AUDIT_OUT" | tail -1
          if [ "$AUDIT_RC" -ne 0 ]; then
            echo "::warning::未投稿キューに確定ファクト違反あり。該当分は投稿対象から自動除外されます（要修正）"
            {
              echo "## ⚠️ Threadsキュー検品NG（未投稿分）"
              echo ""
              echo '```'
              echo "$AUDIT_OUT" | grep -A1 '^\[NG\].*未投稿' || echo "$AUDIT_OUT" | tail -1
              echo '```'
              echo ""
              echo "該当分は投稿されません。\`python threads/threads_content.py --audit\` で確認して修正してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0

      - name: Threads投稿
        if: steps.gate.outputs.should_post == 'true'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        shell: bash
        run: |
          set +e
          ARGS="--next"
          # ゲートは上のステップでも見ているが、生成やpullに時間がかかって
          # ウィンドウを跨いだ場合に備えて投稿直前にもう一度見る。
          if [ "${{ inputs.ignore_window }}" != "true" ]; then
            ARGS="$ARGS --slot-gate"
          fi
          if [ "${{ inputs.require_reply_link }}" = "true" ]; then
            ARGS="$ARGS --require-reply-link"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "python threads/threads_poster.py $ARGS"
          python threads/threads_poster.py $ARGS
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::warning::Threads投稿が非ゼロ終了 exit=$EXIT"
            echo "## ⚠️ Threads投稿失敗 (exit=$EXIT)" >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: ログ保存
        if: always() && steps.gate.outputs.should_post == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 先にcommitしてからpullする。ポスターが書き換えた threads/threads_posts.json や
          # data/threads_post_log.csv が未commitのまま pull --rebase すると
          # "cannot pull with rebase: You have unstaged changes" で必ず失敗し、
          # 古いbase上でcommit→push rejected という詰み方をする（2026-08-05にnote側で実際に事故）
          git add threads/threads_posts.json data/threads_post_log.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ログに変更なし"
            exit 0
          fi
          git commit -m "Threads投稿ログ更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          # pushの失敗を握り潰すと「投稿済み」記録が消えて次回の重複投稿要因になるためリトライする
          PUSHED=0
          for i in 1 2 3; do
            if git push origin main; then PUSHED=1; break; fi
            echo "push失敗 (試行$i) → rebaseして再試行"
            sleep 5
            # data/threads_post_log.csv の末尾衝突は .gitattributes の merge=union が自動解決する。
            # threads/threads_posts.json はJSONなので union は付けられない（壊れる）。
            # 解決できない衝突が残ったら rebase を必ず畳む。放置すると detached HEAD になり、
            # 以降のpull/pushが全部死んでログcommitごと消える
            git pull --rebase origin main || { git rebase --abort || true; git checkout main || true; }
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::Threads投稿ログをpushできませんでした。Threads上は投稿済みでもログ未記録の可能性があります"
            echo "## ❌ 投稿ログのpush失敗（Threads側は投稿済みの可能性あり）" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
