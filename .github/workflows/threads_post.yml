name: Threads自動投稿

on:
  schedule:
    # Pull戦略・安全運用: 1日2回まで（JST 8:00 / 20:00 = UTC 23:00 / 11:00）
    - cron: '0 23 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'テスト実行（投稿しない）'
        type: boolean
        default: false

# 重複投稿・git競合を防ぐ
concurrency:
  group: threads-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  threads-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存パッケージ
        shell: bash
        run: |
          set +e
          pip install requests google-genai
          exit 0

      - name: 最新データ取得
        shell: bash
        run: |
          set +e
          git pull --rebase origin main
          exit 0

      - name: キューを補充（残り少なければGeminiで生成）
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +e
          UNPOSTED=$(python -c "import json;d=json.load(open('threads/threads_posts.json'));print(sum(1 for p in d if not p.get('posted')))" 2>/dev/null || echo 0)
          echo "未投稿キュー: $UNPOSTED"
          if [ "$UNPOSTED" -lt 4 ]; then
            # 生成後に機械検品で落とす分があるので、必要数より多めに要求する
            echo "キュー残りわずか → 生成"
            python threads/threads_content.py --gen 14
          fi
          echo "--- キュー検品 ---"
          python threads/threads_content.py --audit | tail -1
          exit 0

      - name: Threads投稿
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python threads/threads_poster.py --next --dry-run
          else
            python threads/threads_poster.py --next
          fi
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::warning::Threads投稿が非ゼロ終了 exit=$EXIT"
            echo "## ⚠️ Threads投稿失敗 (exit=$EXIT)" >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: ログ保存
        if: always()
        shell: bash
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 先にcommitしてからpullする。ポスターが書き換えた threads/threads_posts.json や
          # data/threads_post_log.csv が未commitのまま pull --rebase すると
          # "cannot pull with rebase: You have unstaged changes" で必ず失敗し、
          # 古いbase上でcommit→push rejected という詰み方をする（2026-08-05にnote側で実際に事故）
          git add threads/threads_posts.json data/threads_post_log.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "ログに変更なし"
            exit 0
          fi
          git commit -m "Threads投稿ログ更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          # pushの失敗を握り潰すと「投稿済み」記録が消えて次回の重複投稿要因になるためリトライする
          PUSHED=0
          for i in 1 2 3; do
            if git push origin main; then PUSHED=1; break; fi
            echo "push失敗 (試行$i) → rebaseして再試行"
            sleep 5
            # data/threads_post_log.csv の末尾衝突は .gitattributes の merge=union が自動解決する。
            # threads/threads_posts.json はJSONなので union は付けられない（壊れる）。
            # 解決できない衝突が残ったら rebase を必ず畳む。放置すると detached HEAD になり、
            # 以降のpull/pushが全部死んでログcommitごと消える
            git pull --rebase origin main || { git rebase --abort || true; git checkout main || true; }
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::Threads投稿ログをpushできませんでした。Threads上は投稿済みでもログ未記録の可能性があります"
            echo "## ❌ 投稿ログのpush失敗（Threads側は投稿済みの可能性あり）" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
