name: Threadsインサイト集計

on:
  schedule:
    # 週1（JST 月曜 9:00 = UTC 日曜 0:00）。読み取りのみなのでレート負荷は軽い
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: '取得する投稿数'
        default: '200'

concurrency:
  group: threads-insights
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 依存パッケージ
        run: pip install requests

      - name: インサイト取得
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          # tee を挟むとPython側の異常終了が握り潰されて緑になる。トークン切れで
          # ずっと0件のまま成功扱いにしないため pipefail を必ず立てる
          set -o pipefail
          set +e
          python threads/threads_insights.py --limit "${{ inputs.limit || 200 }}" | tee /tmp/report.txt
          RC=$?
          {
            echo '## Threadsインサイト'
            echo '```'
            if [ "$RC" -eq 0 ]; then
              sed -n '/^=\{10,\}/,$p' /tmp/report.txt
            else
              grep -E '^\[(ERROR|WARN)\]|^ ' /tmp/report.txt | tail -20
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $RC

      - name: CSV保存
        if: always()
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/threads_insights.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "変更なし"; exit 0
          fi
          git commit -m "Threadsインサイト更新 $(TZ=Asia/Tokyo date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            if git push origin main; then exit 0; fi
            sleep 5
            git pull --rebase origin main || { git rebase --abort || true; git checkout main || true; }
          done
          echo "::warning::インサイトCSVのpushに失敗"
