name: 生成キュー確定ファクト番犬

# X (posts/twitter_posts.json) と Threads (threads/threads_posts.json) の
# **未投稿キュー**に、確定ファクト違反の投稿が残っていないかを毎週見る番犬。
#
# 背景（2026-09-04）: posts/twitter_posts.json に確定ファクト違反の投稿が5本
#   （g39 / g40 / g_follow10 / evo_397 / evo_564）残っていた。
#   cloud_post.py は投稿直前に x_post_guard.violations() で候補から除外するので、
#   これらは在庫として数えられるのに一生投稿されない「見えない欠品」になっていた。
#   在庫を「キュー本数 − 投稿済みID数」で見積もると、その分だけ水増しされる。
#   同じ構造は Threads の _violations() にもある（基準を後から厳しくした分が
#   既存キューに残る）。
#
# x_purge_violations.yml は **公開済みポスト**（タイムライン）を走査する別物で、
# 未投稿キューはスコープ外。だからキュー側にはこの番犬が要る。
#
# 動作: queue_facts_guard.py を実行し、
#   - X / Threads それぞれの未投稿分を、各媒体の正本の検品にかける
#     （X = x_post_guard.details() / Threads = threads_content._violations()）
#   - Instagram = ig_poster.facts_violations()（ig_poster.queue_candidates() が返す分）
#   - 1件でも違反が残っていればランを赤にし、Issue を作成/更新して通知する
#   - 全部0件に戻ったら、その Issue を自動クローズする（他の番犬と同じ型）
#
# 2026-09-05: Instagram を追加。ig_poster.post_next() には 2026-09-04 に投稿直前
# ゲートが入ったのに、**弾いた分を報告する側が無かった**（ig_poster.py のコメントは
# 「弾いた分は queue_facts_guard.py が報告する」と書いてあるのに、この番犬は
# IGを一切見ていなかった）。ゲートだけで報告が無い状態は、X で実際に起きた
# 「在庫に数えられるのに一生投稿されない」に逆戻りする。

on:
  schedule:
    - cron: '15 3 * * 1'   # 毎週月曜 JST 12:15（他ワークフローの cron と重ならない枠）
  push:
    paths:
      - 'posts/twitter_posts.json'
      - 'threads/threads_posts.json'
      - 'instagram/ig_posts.json'
      - 'queue_facts_guard.py'
      - 'x_post_guard.py'
      - 'threads/threads_content.py'
      - 'instagram/ig_poster.py'
      - 'facts_patterns.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  queue-facts-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # x_post_guard / threads_content / facts_patterns は標準ライブラリだけで動くが、
      # IG の候補判定に使う ig_poster が requests を import する（モジュール先頭）。
      # 入れないと ImportError でランが落ちて、番犬が「壊れて赤」になる。
      - name: 依存パッケージインストール
        run: pip install requests

      - name: 未投稿キューを走査
        id: guard
        run: python3 queue_facts_guard.py --json

      - name: 違反検知 → Issue通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '生成キューに確定ファクト違反（生成キュー確定ファクト番犬）';
            let report = {total_violations: 0, x: {}, threads: {}};
            try {
              report = JSON.parse(fs.readFileSync('data/queue_facts_guard_report.json', 'utf8'));
            } catch (e) {}
            const section = (label, sec) => {
              const vs = (sec.violations || []);
              if (!vs.length) return `### ${label}\n違反なし（未投稿 ${sec.unposted ?? '?'}本）`;
              const lines = vs.map(v => {
                const ident = v.id != null ? v.id : `#${v.idx}`;
                return `- \`${ident}\`${v.angle ? ` (${v.angle})` : ''} — ${(v.labels || []).join(' / ')}\n  - ${v.head}`;
              }).join('\n');
              return `### ${label}（\`${sec.file}\`）\n未投稿 ${sec.unposted}本中 **${vs.length}本**が違反:\n${lines}`;
            };
            const body = [
              '## 生成キュー確定ファクト番犬 検知',
              '',
              '未投稿キューに確定ファクト違反の投稿が残っています。',
              '`cloud_post.py` / `threads_content.py` / `ig_poster.py` は投稿直前（または生成時）に',
              'これらを候補から除外するので、**直さない限り在庫に数えられるだけで',
              '一生投稿されません**（「見えない欠品」）。',
              '在庫を「キュー本数 − 投稿済み数」で見積もると、その分だけ水増しされます。',
              '',
              section('X', report.x || {}),
              '',
              section('Threads', report.threads || {}),
              '',
              section('Instagram', report.instagram || {}),
              '',
              '## 対処',
              '1. 該当投稿の本文を確定ファクトに合わせて直す',
              '   （禁止語・割合統計・収入レンジの正本は `facts_patterns.py`）',
              '2. 直せない／もう不要なら、そのエントリをキューから削除する',
              '3. `python3 queue_facts_guard.py` がローカルで緑になることを確認',
              '',
              '直すと次回のランがこの Issue を自動クローズします。',
              '',
              '---',
              '_この Issue は `.github/workflows/queue_facts_guard.yml` により自動生成されました。_',
            ].join('\n');
            // 違反が残り続けるあいだ毎ラン同じ内容を貼ると通知が形骸化するので、
            // 内容（違反の顔ぶれ）が変わったときだけ鳴く。赤は維持される。
            const guard = require('./.github/scripts/guard_comment.js');
            const xIds = (report.x?.violations || []).map(v => v.id).join(',');
            const thIds = (report.threads?.violations || []).map(v => `#${v.idx}`).join(',');
            const igIds = (report.instagram?.violations || []).map(v => v.id).join(',');
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()}\nX: ${xIds || 'なし'}\nThreads: ${thIds || 'なし'}\nInstagram: ${igIds || 'なし'}`,
            });

      - name: 違反解消 → Issueを自動クローズ
        # queue_facts_guard.py は毎回キュー全体を数え直すので、
        # 緑＝未投稿キューに違反が1件も無いことが確定する。
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '生成キューに確定ファクト違反（生成キュー確定ファクト番犬）';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `解消を確認: ${new Date().toISOString()} のランで未投稿キューに確定ファクト違反はありませんでした。自動クローズします。`,
                '',
                `- ラン: ${runUrl}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
