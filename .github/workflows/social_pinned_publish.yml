name: 固定ポスト差し替え（Threads）

# Threads の固定用投稿を確定ファクト準拠版で投稿する。手動dispatch専用。
#
# 2026-11-02: X 側（post-x / delete-x）は撤去した。X自動化を全部撤去したため
# （x_content/RETIRED.md）。
#
# ⚠️ 固定/固定解除の公開APIは Threads に存在しない。
#    このワークフローは **投稿まで**。固定操作はアプリ側で手動。

on:
  workflow_dispatch:
    inputs:
      action:
        description: '実行する操作'
        type: choice
        required: true
        options:
          - post-threads
      dry_run:
        description: '送信せず内容と文字数だけ確認する'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - name: 実行
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          set -eu
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          case "${{ inputs.action }}" in
            post-threads) python3 social_pinned_publish.py --post-threads $DRY ;;
          esac
