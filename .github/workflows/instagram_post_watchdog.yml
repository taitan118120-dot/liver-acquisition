name: Instagram投稿ウォッチドッグ

# Instagram自動投稿の「サイレント停止」を検知する番犬。
#
# 背景: 2026-09-11 に instagram_post.yml を「30分おき起動＋JSTウィンドウ判定」へ
# 切り替えた。それまでは遅延しても（深夜でも）必ず出ていたが、新方式は
# 「ウィンドウ外なら投稿しない」ので、Actions の遅延が想定外に伸びるとその日の
# 投稿が丸ごと0本になりうる。しかもゲートで抜けたランは success で終わるため、
# ワークフローの色では気づけない。
#
# それ以前からある「緑の嘘」もここで拾う。2026-09-08 に
# INSTAGRAM_ACCESS_TOKEN が失効したが、instagram_post.yml も
# instagram_token_refresh.yml も success のままで、9/9(水)の投稿が丸ごと
# 落ちていた（気づいたのは9/11）。判定材料をワークフローの結果ではなく
# 「instagram/ig_posts.json の posted_at（投稿成功時にだけ書かれる）」に
# 置いてあるので、この型の失敗も検知できる。
#
# 動作: 直近7日の投稿曜日(月/水/金・JST)で投稿0本の日があれば
#   1. ignore_window=true で自動投稿を即時トリガー（自己回復の試み）
#   2. Issueを作成/更新して通知
# 投稿が再開したらそのIssueを自動クローズする（[[feedback_watchdog_autoclose]]）。
#
# 判定ロジックは instagram/ig_slot.py --missed が正本。ウィンドウや曜日を
# 変えるときは ig_slot.py 側だけ直せばここも追随する。

on:
  schedule:
    # 毎日 JST 12:40（UTC 3:40）。この番犬自身も schedule 遅延を受けるが、
    # ig_slot.py --missed は「今日より前の投稿曜日」だけを見るので、
    # 何時に走っても判定はぶれない。
    - cron: '40 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: 直近7日の投稿曜日で欠けがないか確認
        id: check
        shell: bash
        run: |
          set +e
          python3 instagram/ig_slot.py --missed --lookback 7
          exit 0

      # 今日が投稿曜日なら撃たない。数時間後に通常のウィンドウが来るのに
      # ここで臨時投稿すると、今日の枠を昼過ぎの悪い時刻で潰してしまう
      # （ig_slot は1日1本しか通さないため）。
      - name: 欠け検知 → 投稿をウィンドウ無視で即時トリガー
        if: >-
          steps.check.outputs.missed_count != '' &&
          steps.check.outputs.missed_count != '0' &&
          steps.check.outputs.today_is_post_day != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "投稿0本の日: ${{ steps.check.outputs.missed }}"
          echo "ウィンドウを無視して1本出します（週3回のペースを取り戻す）。"
          gh workflow run instagram_post.yml --repo "$GITHUB_REPOSITORY" -f ignore_window=true

      - name: 欠け検知だが今日は投稿曜日 → 通常ウィンドウに任せる
        if: >-
          steps.check.outputs.missed_count != '' &&
          steps.check.outputs.missed_count != '0' &&
          steps.check.outputs.today_is_post_day == 'true'
        run: |
          echo "投稿0本の日: ${{ steps.check.outputs.missed }}"
          echo "今日は投稿曜日なので臨時投稿は撃たず、通常のウィンドウ(JST 19:50-22:30)に任せます。"

      - name: 欠け検知 → Issue通知
        if: steps.check.outputs.missed_count != '' && steps.check.outputs.missed_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Instagram自動投稿が投稿日を落としています（ウォッチドッグ検知）';
            const missed = '${{ steps.check.outputs.missed }}';
            const body = [
              '## Instagram投稿ウォッチドッグ検知',
              '',
              `直近7日の投稿曜日（月/水/金・JST）のうち、投稿が0本だった日: **${missed}**`,
              '',
              '判定は `instagram/ig_posts.json` の `posted_at`（投稿成功時にだけ書かれる値）で',
              'しています。ワークフローが success でも投稿できていなければここで挙がります。',
              '',
              '- 今日が投稿曜日でなければ `ignore_window=true` で自動投稿を即時トリガー済み',
              '  （投稿曜日なら、数時間後の通常ウィンドウに任せて臨時投稿は撃たない）',
              '- 検知内容が変わったときだけこのIssueにコメントが追加されます',
              '',
              '## 原因確認',
              '```bash',
              'gh run list --workflow=instagram_post.yml --limit 20',
              '# ゲートの判定理由は各ランの「投稿ウィンドウ判定（JST）」ステップに出る',
              'python3 instagram/ig_slot.py --check',
              'python3 instagram/ig_slot.py --missed',
              '```',
              '',
              'よくある原因:',
              '- `INSTAGRAM_ACCESS_TOKEN` の失効（ログに `Session has expired` が出る）。',
              '  この場合 instagram_token_refresh.yml も投稿ワークフローも success のままなので、',
              '  色では気づけない',
              '- Actions の遅延が伸びて、どのランも `ig_slot.WINDOW` の枠に入らなかった',
              '- Gemini のカルーセル生成が失敗して投稿対象が無かった',
              '',
              '直すと次回のランがこのIssueを自動クローズします。',
              '',
              '---',
              '_このIssueは `.github/workflows/instagram_post_watchdog.yml` により自動生成されました。_',
            ].join('\n');
            const guard = require('./.github/scripts/guard_comment.js');
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()} 時点でも投稿0本の日があります（${missed}）。`,
            });

      - name: 投稿再開を確認 → Issueを自動クローズ
        # 検知しても赤くならない型なので success() だけでは排他にならない。
        # 空文字を弾くのは、check ステップがコケたランを「復旧」と誤読しないため。
        if: success() && steps.check.outputs.missed_count == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Instagram自動投稿が投稿日を落としています（ウォッチドッグ検知）';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) return;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `復旧を確認: ${new Date().toISOString()} のランで、直近7日の投稿曜日はすべて投稿済みでした。自動クローズします。`,
                '',
                `- ラン: ${runUrl}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
