name: 公開コンテンツ確定ファクト番犬

# LP・特典PDF原稿・**配布中のPDF実体**・**Note記事の原稿**の確定ファクト違反を毎日検知する番犬。
#
# 背景（2026-08-12）: 「京都コレクションは実在しない」と2026-08-01に確定していたのに、
# lp/beginner・lp/agency の #network カードと lead_magnet/agency_starter_guide.html P6、
# そして **そこから焼いた配布中の lp/shared/agency_starter_guide.pdf の実体** に
# 残っていた。LINE登録した代理店希望者に、実在しないイベントが配られていた。
#
# 真因はまたも走査対象の設計:
#   - link_guard.py は lp/**/*.html を見ているが **リンクの生死しか見ない**
#   - social_profile_guard.py は「京都コレクション」の禁止パターンを持っていたが
#     **走査対象がプロフィールと固定ポストだけ**（＝共通正本に無かった）
#   - lead_magnet/*.html と lp/shared/*.pdf は **どの番犬のスコープにも無かった**。
#     PDFはバイナリなので普通の grep でも一生ヒットしない
#
# 2026-08-12（同日追記）: 同じ穴が blog/ にも残っていた。記事149本は link_guard の
# CONTENT_GLOBS に入っているが、あれは**リンクの生死を見るだけ**で文面を見ない。
# 実際 blog/articles/work-from-home-sidejob.md の禁止語「挫折率」は一度も検知されていなかった。
# 記事も走査対象に入れた（ただしWARNの物差しは記事用に分けている。下の「警告」節を参照）。
#
# 2026-08-12（さらに同日追記）: 上の「記事はWARNどまり」に穴があった。
# 記事12本が「最低契約期間が1年以上」「2年以上の長期契約は要注意」「違約金ありは危険」を
# **怪しい事務所の見分け方**として読者に教えていた。TAITAN PRO は2年契約なので、
# これを読んで面談に来た人には「御社は2年ですよね？」とそのまま跳ね返る。
# 既存ルールは「違約金・契約期間」という**語の出現**しか見ておらず、しかも記事では
# WARN（64件）に落としてあったので、中立な「違約金の有無を確認しよう」と
# 自社を撃つ「最低契約期間が1年以上は悪質」が同じ山に埋もれて区別できなかった。
# 語ではなく**判断軸**を見る contract_axis_violations を共通正本に足し、
# これだけは記事でも赤にする（WARNに落とせないよう guard 側で assert している）。
#
# 動作: 毎日1回 content_facts_guard.py を実行し、
#   - LP4本・特典原稿HTML・配布PDF（pdftotextで抽出）・記事149本に
#     確定ファクトの禁止パターンを当てる
#     （パターンの正本は facts_patterns.py。この番犬はコピーを持たない）
#   - 原稿HTML と 配布PDF が同期しているか（焼き直し忘れ／別バージョン配布）
#   - jsDelivr のSHA固定URLが、いま手元にあるPDFと同じ実体を配っているか
#   - lp/shared/*.pdf に「どこからも参照されていない配布物」が残っていないか
#   - 違反があればランを赤にし、Issueを作成/更新して通知
#   - 直って0件に戻ったら、そのIssueを自動クローズする（他の番犬と同じ型）

on:
  schedule:
    - cron: '0 1 * * *'   # 毎日 JST 10:00（プロフィール番犬の20分後）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  content-facts-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # SHA固定チェックは「ピン留めされた過去コミットのPDF」を git から読む。
          # 既定の浅いクローン（fetch-depth: 1）だとそのオブジェクトが無く、
          # 本命の検査が丸ごと空振りする。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: |
          pip install requests
          # PDFはバイナリなので、これが無いと配布物を一切検査できない
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pdftotext -v

      - name: LP・特典原稿・配布PDF・記事走査
        id: guard
        run: python3 content_facts_guard.py

      - name: 検知 → Issue通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '公開コンテンツに確定ファクト違反（公開コンテンツ確定ファクト番犬）';
            let report = {violations: [], warn: [], scanned: {html: [], pdf: [], article: []}};
            try {
              report = JSON.parse(fs.readFileSync('data/content_facts_guard_report.json', 'utf8'));
            } catch (e) {}
            const vLines = (report.violations || []).map(v =>
              `- **${v.where}** — ${v.reason}` + (v.hit ? `\n  - 該当: \`${v.hit}\`` : '')).join('\n');
            // WARN は記事を入れると200件超になる。全部並べると違反本体が埋もれるので、
            // 理由ごとに件数でたたんで、中身は先頭5件だけ見せる（全件はレポートJSON）。
            const warnGroups = new Map();
            for (const v of (report.warn || [])) {
              if (!warnGroups.has(v.reason)) warnGroups.set(v.reason, []);
              warnGroups.get(v.reason).push(v);
            }
            const wLines = [...warnGroups.entries()]
              .sort((a, b) => b[1].length - a[1].length)
              .map(([reason, items]) => {
                const head = items.slice(0, 5)
                  .map(v => `  - ${v.where}: \`${v.hit}\``).join('\n');
                const rest = items.length > 5
                  ? `\n  - …ほか ${items.length - 5} 件` : '';
                return `- **[${items.length}件] ${reason}**\n${head}${rest}`;
              }).join('\n');
            // 記事は149本あるので個別には並べない（Issueが記事一覧で埋まる）。
            // 全件は data/content_facts_guard_report.json の scanned.article にある。
            const sLines = [...(report.scanned?.html || []), ...(report.scanned?.pdf || [])]
              .map(s => `- \`${s}\``).join('\n')
              + `\n- 記事 \`blog/articles/*.md\` + \`blog/articles_note/*.md\` `
              + `${(report.scanned?.article || []).length} 本`;
            const body = [
              '## 公開コンテンツ確定ファクト番犬 検知',
              '',
              'LP・特典PDF・記事は**一度書いたら二度と読み返さない場所**です。',
              'とくに `lp/shared/*.pdf` は**バイナリなので普通の grep に一切引っかからず**、',
              '原稿HTMLだけを直して「直した」と思い込むと、**配られているのは古いPDFのまま**になります。',
              '実際 2026-08-12 に、実在しない「京都コレクション」が配布中の代理店特典PDFに残っていました。',
              '記事も同じ日まで**どの禁止語番犬のスコープにも入っていません**でした',
              '（link_guard は記事を見ているがリンクの生死だけ）。',
              '',
              '## 検知された違反',
              vLines || '(レポート読込失敗。ランのログを確認)',
              '',
              '## 警告（主語・文脈で可否が変わるので人が判断する。赤にはしない）',
              '少額表記・実績誇張・他社比較は、ライバーの収入目安なのか代理店報酬なのか等、',
              '**主語で可否が変わる**ため自動判定しません（`facts_patterns.AUDIT_WARN_LABELS`）。',
              '記事はさらに「断定・保証表現」「違約金・契約期間」「手数料」「取扱外プラットフォーム」も',
              '警告どまりです（`content_facts_guard.ARTICLE_WARN_LABELS`）。',
              '事務所選びの解説記事では、これらを**悪い例の引用・読者への注意喚起**として書くのが',
              '正しい形になるため（「『絶対稼げる』と断言する事務所は危険」など）。',
              '',
              '**ただし「自社と矛盾する判断軸」だけは警告ではなく赤です。**',
              '契約期間の**長さ**や違約金の**有無そのもの**を怪しい事務所の基準にすると、',
              'TAITAN PRO は2年契約なので、それを読んで面談に来た人に',
              '「御社は2年ですよね？」とそのまま跳ね返ります（記事が自分を撃つ）。',
              '2026-08-12 に12箇所見つかり、64件の「違約金・契約期間」WARNに埋もれて',
              '誰も気づいていませんでした。だから別ラベルで分けて赤にしています。',
              '',
              wLines || '(なし)',
              '',
              '## 走査した対象',
              sLines || '(なし)',
              '',
              '## 対処',
              '1. 禁止パターンの正本は `facts_patterns.py`。**この番犬にコピーは無い**ので、',
              '   ルールを足すときは共通正本に足す（全媒体に同時に効く）',
              '2. 特典PDFを直すときは **原稿HTMLだけ直しても配布物は変わらない**。必ず3点セット:',
              '   - `python3 lead_magnet/build_pdf.py` で焼き直す',
              '   - 変わったPDFをコミットする',
              '   - `line_bot/messages.py` の `GUIDE_PDF_SHA` / `AGENCY_GUIDE_PDF_SHA` を',
              '     **そのコミットのSHA**へ更新する（jsDelivrはSHA固定配信なので、',
              '     ここを上げないと直したPDFは登録者に届かない）',
              '3. LPは `lp/**/*.html` を直して push（Netlifyが自動デプロイ）',
              '4. **記事（`blog/articles_note/*.md`）は .md を直しても note 上は変わらない**。',
              '   108本が note で公開中なので、原稿を直したら公開側にも反映する:',
              '   - Actions の「Note記事 一括更新」を実行（`--update` / `--update-all`）',
              '   - タグとカバーは fetch-PUT で落ちるので、`note_tag_guard` の自己検証まで見る',
              '   - `blog/articles/*.md`（自社ブログ）は push だけで反映',
              '5. **「自社と矛盾する判断軸」が出た場合**は、語を消すのではなく**軸を差し替える**。',
              '   935da09 で全記事を統一した形に合わせる（長さ → 明記・説明されているか）:',
              '   - ❌「最低契約期間が1年以上」「2年以上の長期契約は要注意」「違約金ありは危険」',
              '   - ✅「契約期間や違約金の条件が**書面に明記**されているか」',
              '     「聞いたときに**きちんと説明**してくれるか」',
              '   中立形（「有無」「明記」「書面」「説明」を含む文）は番犬側で素通りします。',
              '6. 修正後 `python3 content_facts_guard.py --repo-only` がローカルで緑になることを確認',
              '',
              '直すと次回のランがこのIssueを自動クローズします。',
              '',
              '---',
              '_このIssueは `.github/workflows/content_facts_guard.yml` により自動生成されました。_',
            ].join('\n');
            // 同じ違反が直るまでは毎ラン赤になる。そのたびに同内容のコメントを積むと
            // メール通知だけが毎日増えるので、内容が変わったときだけ鳴く（赤は維持）。
            const guard = require('./.github/scripts/guard_comment.js');
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()}\n\n${vLines}`,
            });

      - name: 違反0件 → Issueを自動クローズ
        # 番犬は「鳴く」だけでなく「鳴きやむ」ところまでが仕組み（link_guard の教訓）
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '公開コンテンツに確定ファクト違反（公開コンテンツ確定ファクト番犬）';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number,
              body: `復旧を確認: ${new Date().toISOString()} のランで違反0件でした。自動クローズします。`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: match.number, state: 'closed',
            });
