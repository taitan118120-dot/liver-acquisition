name: Noteカバー画像 番犬

# Note記事のカバー画像（アイキャッチ）付け忘れを push 時点で検知する番犬。
#
# 背景: 2026-07-23、#120-122 で「記事(.md)は追加したがカバー画像を付け忘れた」
# ことにより note_daily_post が exit 3 で連続失敗（#93・#99 も同様の欠落が潜在）。
# poster 側の exit 3 ガードは「翌日の投稿ジョブ」まで顕在化しないため、
# 原因コミットから時間が経ってから気づいていた。
#
# 動作: 記事 or 画像を触った push / PR で note_cover_guard.py を実行し、
#   blog/articles_note/ の全記事番号に対して blog/images/{番号}_*.png の
#   存在を照合。欠落があればランを赤にし、Issueを作成/更新して通知する。
#   画像が追加されて欠落ゼロに戻ったら、そのIssueを自動クローズする。
# → 付け忘れが「コミットした瞬間」に赤くなり、翌日の投稿失敗を未然に防ぐ。
#
# 【2026-08-07 追加】自動クローズがなかったため、link_guard の Issue #5 は
# 直後に修正済みだったのに18日間オープンのまま放置され、通知が形骸化していた。
# 番犬は「鳴く」だけでなく「鳴きやむ」ところまでが仕組み。

on:
  push:
    paths:
      - 'blog/articles_note/**'
      - 'blog/images/**'
      - 'note_cover_guard.py'
      - 'note_set_eyecatch.py'
  pull_request:
    paths:
      - 'blog/articles_note/**'
      - 'blog/images/**'
  schedule:
    - cron: '25 0 * * *'   # 毎日 JST 9:25（取りこぼしの最終防波堤）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cover-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: カバー画像の存在を照合
        id: guard
        run: python3 note_cover_guard.py --json

      - name: 欠落検知 → Issue通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Noteカバー画像 欠落検知（カバー番犬）';
            let report = {total: 0, missing: []};
            try {
              report = JSON.parse(fs.readFileSync('data/note_cover_guard_report.json', 'utf8'));
            } catch (e) {}
            const lines = (report.missing || []).map(m =>
              `- #${m.num} \`${m.article}\`\n  - 追加先: \`blog/images/${m.num}_*.png\``
            ).join('\n');
            const body = [
              '## Noteカバー画像 番犬 検知',
              '',
              '記事(.md)はあるのに **カバー画像(blog/images/{番号}_*.png)が無い** 記事があります。',
              'このまま放置すると `note_daily_post` が該当記事の投稿時に **exit 3 で失敗** します。',
              '',
              '## 欠落している記事',
              lines || '(レポート読込失敗。ランのログを確認)',
              '',
              '## 対処',
              '1. 記事内容に合う画像を `blog/images/{番号}_slug.png` として追加',
              '   （テキストだけのカードは禁止。テーマの近い既存イラスト素材の流用可）',
              '2. `python3 note_cover_guard.py` がローカルで緑になることを確認',
              '',
              '直すと次回のランがこのIssueを自動クローズします。',
              '',
              '---',
              '_このIssueは `.github/workflows/note_cover_guard.yml` により自動生成されました。_',
            ].join('\n');
            // 同じ欠落が直るまでは毎ラン赤になる。そのたびに同内容のコメントを積むと
            // メール通知だけが毎日増えるので、内容が変わったときだけ鳴く（赤は維持）。
            const guard = require('./.github/scripts/guard_comment.js');
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()}\n\n${lines}`,
            });

      - name: 欠落解消 → Issueを自動クローズ
        # note_cover_guard.py は全記事×全画像を毎回照合する「現在の全状態」の検査なので、
        # 緑＝欠落ゼロが確定する。失敗時は success() が false になるので
        # 上の通知ステップとは排他になる。
        # pull_request のランはまだ main に入っていない状態なので対象外
        # （マージ後の push / 毎日の schedule で改めて緑になったときに閉じる）。
        if: success() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Noteカバー画像 欠落検知（カバー番犬）';
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = existing.find(i => i.title === title);
            if (!match) return;
            // 検査本数はレポートから拾う。読めなくてもクローズ判断は
            // ステップの成否だけで決まるので、文面から本数を落とすだけにする。
            let total = null;
            try {
              total = JSON.parse(
                fs.readFileSync('data/note_cover_guard_report.json', 'utf8')
              ).total;
            } catch (e) {}
            const scope = total === null ? '全記事' : `記事${total}本すべて`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `復旧を確認: ${new Date().toISOString()} のランで ${scope} にカバー画像が揃っていました（missing=0）。自動クローズします。`,
                '',
                `- ラン: ${runUrl}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
