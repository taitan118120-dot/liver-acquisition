name: LP表示番犬

# 公開LP（taitan-pro-lp.netlify.app）の表示素材（CSS/JS/画像）の404を検知する番犬。
#
# 旧「LPドリフト番犬」（lp_drift_guard.yml）の素材チェックだけを切り出したもの。
# 2026-10-14 に手動zipデプロイの -targets サイトを削除して公開LPが1つになったので、
# 2サイトの本文突合は撤去し、メイン側の表示崩れチェックだけを残した。
#
# 背景（2026-10-08）: lp/netlify.toml の / → /beginner/index.html が status=200 の書き換えだったため、
# トップでは相対 style.css が /style.css を見て404になり、2026-07-20〜10-08 ずっと
# CSSなしの素のHTMLで表示されていた。HTMLは200なので link_guard（URLの生死）も緑のままだった。
#
# 動作: 毎日1回 lp_asset_guard.py を実行し、
#   - / と各ページの同一オリジンの CSS/JS/画像 が200か確認
#   - 壊れていればランを赤にし、Issueを作成/更新して通知
#   - **その入口が実際に全部200へ戻ったことを確認してから** Issueを自動クローズする

on:
  schedule:
    - cron: '35 0 * * *'   # 毎日 JST 9:35（link_guard 9:20 / content_facts_guard の後ろ）
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lp-asset-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージインストール
        run: pip install requests

      - name: LPの表示素材を確認
        id: guard
        # スクリプトが途中で落ちたときに古いレポートを読んで「直った」と判定しないよう、先に消す。
        run: |
          rm -f data/lp_asset_guard_report.json
          python3 lp_asset_guard.py

      - name: 検知 → Issue通知
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const guard = require('./.github/scripts/guard_comment.js');
            let report = null;
            try {
              report = JSON.parse(fs.readFileSync('data/lp_asset_guard_report.json', 'utf8'));
            } catch (e) {}

            const title = 'LP表示素材の404検知（LP表示番犬）';
            // レポート自体が無い（スクリプトが落ちた）ときも鳴く。マーカーは付けない＝自動クローズしない。
            if (!report) {
              await guard.notify({
                github, context, title,
                body: 'lp_asset_guard.py がレポートを書く前に落ちました。ランのログを確認してください。',
                recomment: `再検知: ${new Date().toISOString()}\n\nスクリプトがレポートを書く前に落ちました。`,
              });
              return;
            }
            const broken = report.broken || [];
            const lines = broken.map(b =>
              b.kind === 'page'
                ? `- \`${b.entry}\` — ${b.reason}`
                : `- \`${b.entry}\`（最終URL ${b.final_url}）— ${b.kind}: \`${b.asset}\` が ${b.reason}`
            ).join('\n');
            const entries = [...new Set(broken.map(b => b.entry))];
            const marker = `<!-- lp-asset-guard: ${entries.join(',')} -->`;
            const body = [
              '## LP表示素材の404検知',
              '',
              '公開LP（`taitan-pro-lp.netlify.app`）のHTML自体は返っていますが、ページが読むCSS/JS/画像が取得できません。',
              '**訪問者（Google広告・公式LINE・Note から来た人）にはレイアウト崩れで見えています。**',
              '',
              `確認できた入口: ${(report.verified || []).length}/${(report.entries || []).length}`,
              '',
              '## 取得できない素材',
              lines,
              '',
              '## よくある原因と対処',
              '- **`lp/netlify.toml` の書き換え（status=200）**: URLが元のまま別ディレクトリのHTMLを返すと、',
              '  相対パスの素材が違う場所に解決される（2026-07〜10 のトップ崩れはこれ）。リダイレクト（301）にする。',
              '- **素材ファイルの削除・改名**: HTML側の参照を直すか、ファイルを戻す。',
              '- 「Content-Type が text/html」: 素材のパスがページにリダイレクト／書き換えされている。',
              '',
              '直したら `python3 lp_asset_guard.py` がローカルで緑になることを確認してください。',
              '次回のランが、上記の入口を実際に取得して素材が全部200に戻ったことを確認してから自動クローズします。',
              '',
              '---',
              '_このIssueは `.github/workflows/lp_asset_guard.yml` により自動生成されました。_',
              marker,
            ].join('\n');
            // 同じ不良が直るまでは毎ラン赤になる。内容が変わったときだけ鳴く（赤は維持）。
            await guard.notify({
              github, context, title, body,
              recomment: `再検知: ${new Date().toISOString()}\n\n${lines}\n\n${marker}`,
            });

      - name: 復旧確認 → Issueを自動クローズ
        # ⚠️ 「緑だった」だけでは閉じない（[[feedback_watchdog_autoclose]]）。
        # Issue に埋めたマーカーの入口が、verified に載っていて broken に出ていないときだけ閉じる。
        # レポートは実行前に消しているので、スクリプトが落ちたランでは何も閉じない。
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('data/lp_asset_guard_report.json', 'utf8'));
            } catch (e) {
              core.info(`レポートを読めませんでした（${e.message}）。自動クローズしません。`);
              return;
            }
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const match = issues.find(i => i.title === 'LP表示素材の404検知（LP表示番犬）');
            if (!match) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              per_page: 100,
            });
            const texts = [match.body || '', ...comments.map(c => c.body || '')];
            const wanted = new Set();
            for (const tx of texts) {
              for (const m of tx.matchAll(/<!-- lp-asset-guard: ([^>]*) -->/g)) {
                for (const p of m[1].split(',').map(s => s.trim()).filter(Boolean)) wanted.add(p);
              }
            }
            if (wanted.size === 0) {
              core.info(`#${match.number}: 復旧判定用のマーカーが無いので自動クローズしません。`);
              return;
            }
            const verified = new Set(report.verified || []);
            const stillBad = new Set((report.broken || []).map(b => b.entry));
            const unresolved = [...wanted].filter(p => !verified.has(p) || stillBad.has(p));
            if (unresolved.length) {
              core.info(`#${match.number}: 未確認/未復旧があるので閉じません: ${unresolved.join(', ')}`);
              return;
            }
            const w = [...wanted];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              body: [
                `復旧を確認: ${new Date().toISOString()} のランで、素材が取得できなかった ${w.length} 入口`
                  + `（${w.map(p => '`' + p + '`').join(', ')}）を実際に取得し、`
                  + `同一オリジンの CSS/JS/画像 がすべて200でした。自動クローズします。`,
                '',
                `- ラン: ${runUrl}`,
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: match.number,
              state: 'closed',
            });
