name: Instagram自動投稿

on:
  schedule:
    # 30分おきに終日起動して、実際に投稿するかは instagram/ig_slot.py が
    # JSTの実時刻で決める（投稿頻度は従来どおり 月/水/金 の週3回・1日1本）。
    #
    # 以前は JST 月/水/金 20:00 を狙って UTC 11:00 に置いていたが、Actions の
    # schedule 遅延が 2026-08-27 以降に 22分 → 4〜10時間へ悪化し、実際の着弾が
    # 深夜0時前後に固定されていた（09-02 23:57 / 09-04 23:46 / 09-08 01:16 /
    # 09-10 00:00・すべてJST）。Threads で同じ崩れが起きたときは時刻別リーチの
    # 中央値が3倍近く違ったので、IGでも時間帯を戻す。
    # cron を前倒ししても遅延幅が日によって変わるので制御できない。
    # 「終日起動＋着弾時刻で判定」にすれば遅延が何時間でも枠内の回が必ず出る。
    # ウィンドウ外の回はゲート判定だけで数秒で終わる（PUBLICリポなので無料）。
    # 分は毎時0/15/30/45を避ける（その時刻ほど混雑して遅延が伸びるため）。
    # Threads(18,48) とずらして、ログpushの衝突も減らす。
    - cron: '7,37 * * * *'
  workflow_dispatch:  # 手動実行も可能
    inputs:
      source:
        description: 'コンテンツソース（auto/viral=バズカルーセル）'
        type: choice
        options:
          - auto
          - viral
          - blog
          - twitter
        default: auto
      dry_run:
        description: 'テスト実行（投稿しない）'
        type: boolean
        default: false
      ignore_window:
        description: '投稿ウィンドウ(JST)と曜日指定を無視して即実行する'
        type: boolean
        default: false

# 同時実行を防止（重複投稿・git競合を回避）
concurrency:
  group: instagram-post
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  instagram-post:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # job レベルの continue-on-error は付けない。全ステップが個別に set +e + exit 0 で
    # マスク済みなので二重保護は不要な上、checkout/setup-python の失敗まで緑にしてしまい
    # 「実は一度も走っていない」状態に気づけなくなる。
    steps:
      # ゲート判定までは履歴を引かない。30分おきに起動するので、フルcloneを
      # 毎回やると無駄が大きい。通過した回だけ unshallow する。
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: 投稿ウィンドウ判定（JST）
        id: gate
        shell: bash
        run: |
          set +e
          if [ "${{ inputs.ignore_window }}" = "true" ]; then
            echo "[GATE] ignore_window=true → ウィンドウ判定をスキップ"
            echo "should_post=true" >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 標準ライブラリだけで動くので setup-python / pip install より前に置ける
          python3 instagram/ig_slot.py --check
          exit 0

      - name: 判定結果
        if: steps.gate.outputs.should_post != 'true'
        shell: bash
        run: echo "${{ steps.gate.outputs.reason }} → 今回は投稿しません"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.should_post == 'true'
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        if: steps.gate.outputs.should_post == 'true'
        # 一時的なPyPI障害でも赤くしないため set +e
        shell: bash
        run: |
          set +e
          pip install requests google-genai Pillow
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::warning::pip install失敗 exit=$EXIT - リトライ"
            sleep 10
            pip install requests google-genai Pillow
          fi
          # 失敗しても投稿は不可なのでここで exit 0 して後続ステップで警告を出す
          exit 0

      - name: 最新の投稿データを取得
        if: steps.gate.outputs.should_post == 'true'
        shell: bash
        run: |
          set +e
          # ログ保存の rebase / push に履歴が要るので、ここで全体を引き直す
          git fetch --unshallow --no-tags origin main || git fetch --no-tags origin main
          git pull --rebase origin main
          exit 0

      - name: Instagram投稿実行（多層防御）
        if: steps.gate.outputs.should_post == 'true'
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ID: ${{ secrets.INSTAGRAM_BUSINESS_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set +e  # 失敗でもワークフローを赤にしない（最終セーフティ層）
          echo "Working directory: $(pwd)"
          SOURCE="${{ inputs.source || 'auto' }}"
          export PYTHONPATH="${{ github.workspace }}:${{ github.workspace }}/instagram"

          # ゲートは上のステップでも見ているが、カルーセル画像の生成に数分かかって
          # ウィンドウを跨ぐことがあるので、投稿直前にもう一度見る
          GATE_ARG="--slot-gate"
          if [ "${{ inputs.ignore_window }}" = "true" ]; then
            GATE_ARG=""
          fi

          # Pythonレベルの多層防御: Content-Type検証/catboxフォールバック/GitHub raw/
          # 永続エラー時の次候補自動試行/exit 0+STEP_SUMMARY警告
          # ワークフロー側では Gemini 503 等の一時障害対策の外側リトライのみ行う
          MAX_ATTEMPTS=2
          FINAL_EXIT=0
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "=== 実行試行 $attempt/$MAX_ATTEMPTS ==="
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              python instagram/ig_scheduler.py --generate --source "$SOURCE" --test
            else
              python instagram/ig_scheduler.py --generate --source "$SOURCE" $GATE_ARG
            fi
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              FINAL_EXIT=0
              break
            fi
            FINAL_EXIT=$EXIT_CODE
            if [ $attempt -lt $MAX_ATTEMPTS ]; then
              echo "[WORKFLOW RETRY] 失敗(exit=$EXIT_CODE)、180秒後にリトライ..."
              sleep 180
            fi
          done

          # 最終セーフティ: どんなエラーでもワークフローは必ず成功扱い
          # ユーザー通知は Step Summary 経由で行われる
          if [ $FINAL_EXIT -ne 0 ]; then
            echo "::warning::Instagram投稿は失敗しましたが、Pythonレベルの多層防御で処理済みです。"
            echo "## ⚠️ 投稿スクリプトが非ゼロ終了" >> $GITHUB_STEP_SUMMARY
            echo "exit_code=$FINAL_EXIT。詳細は上のログを確認してください。" >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: 投稿データを保存
        if: always() && steps.gate.outputs.should_post == 'true'
        shell: bash
        run: |
          set +e
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # 先にcommitしてからpullする。ig_scheduler が書き換えた instagram/ig_posts.json 等が
          # 未commitのまま pull --rebase すると "cannot pull with rebase: You have unstaged
          # changes" で必ず失敗する（2026-08-05にnote側で実際に事故った手順）
          git add data/ instagram/ig_posts.json instagram/images/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "[GIT] staged変更なし、skip"
            exit 0
          fi
          git commit -m "Instagram投稿ログ更新"
          # pushの失敗を握り潰すと「投稿済み」記録が消えて次回の重複投稿要因になるためリトライする
          PUSHED=0
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "[GIT] push成功 (attempt=$attempt)"
              PUSHED=1
              break
            fi
            echo "[WARN] git push失敗 attempt=$attempt - rebase してリトライ"
            sleep 3
            # 解決できない衝突が残ったら rebase を必ず畳む。放置すると detached HEAD になり
            # 以降のpull/pushが全部死んでログcommitごと消える
            git pull --rebase origin main || { git rebase --abort || true; git checkout main || true; }
          done
          if [ "$PUSHED" != "1" ]; then
            echo "::error::Instagram投稿ログをpushできませんでした。IG上は投稿済みでもログ未記録のため、次回同じ内容を再投稿する恐れがあります"
            echo "## ❌ 投稿ログのpush失敗（次回重複投稿の恐れあり）" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
